<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Modsy</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- Font styling for consistency -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/orders.css">

</head>
<body>

    <!-- SITE HEADER (Will be augmented automatically by navbar-updater.js) -->
    <header class="site-header site-header--solid">
        <div class="site-header__container container">
            <div class="header-left">
                <div class="logo">
                    <button class="mobile-menu-toggle" aria-label="Open Menu">
                        <ion-icon name="menu-outline"></ion-icon>
                    </button>
                    <a href="index.html" class="logo-link">
                        <svg class="logo-spiral" viewBox="0 0 100 100" width="36" height="36" fill="none" stroke="#6E4424" stroke-width="4.5" stroke-linecap="round">
                            <path d="M 50,50 A 6,6 0 1,0 56,56 A 12,12 0 1,1 44,44 A 18,18 0 1,0 68,68 A 24,24 0 1,1 32,32 A 30,30 0 1,0 80,80" />
                        </svg>
                        <div class="logo-text">
                            <span class="logo-title">Modsy</span>
                            <span class="logo-subtitle">FURNITURE</span>
                        </div>
                    </a>
                </div>
            </div>
            <nav class="main-nav">
                <ul class="main-nav__list">
                    <li><a href="index.html" class="main-nav__link">Home</a></li>
                    <li><a href="products.html" class="main-nav__link">Products</a></li>
                    <li><a href="intranet.html" class="main-nav__link">Intranet</a></li>
                    <li><a href="contact.html" class="main-nav__link">Contact</a></li>
                </ul>
            </nav>
            <div class="header-right">
                <div class="header-actions">
                    <!-- Placeholder for JS injection -->
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="orders-container">
            <div class="orders-header">
                <h1 class="orders-title">Order History</h1>
                <p class="orders-subtitle">View standard details and statuses of your past store purchases.</p>
            </div>

            <div id="orders-feed">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer__grid">
                <div style="grid-column: span 5;">
                    <h2 class="hero__title" style="font-size: 2rem; color: var(--color-primary);">Furniture that fits you.</h2>
                    <p class="hero__description" style="color: var(--color-secondary);">Design custom furniture that fits your room down to the last millimeter.</p>
                </div>
            </div>
            <div class="footer__brand-text">Modsy.</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="../assets/js/script.js"></script>
    <script type="module" src="../assets/js/navbar-updater.js"></script>

    <script type="module" src="../assets/js/orders.js"></script>
</body>
</html>
