<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Collection | Modsy</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header class="site-header site-header--solid">
        <div class="site-header__container container">
            <div class="header-left">
                <div class="logo">
                    <button class="mobile-menu-toggle" aria-label="Open Menu">
                        <ion-icon name="menu-outline"></ion-icon>
                    </button>
                    <a href="index.html" class="logo-link">
                        <svg class="logo-spiral" viewBox="0 0 100 100" width="36" height="36" fill="none" stroke="#6E4424" stroke-width="4.5" stroke-linecap="round">
                            <path d="M 50,50 A 6,6 0 1,0 56,56 A 12,12 0 1,1 44,44 A 18,18 0 1,0 68,68 A 24,24 0 1,1 32,32 A 30,30 0 1,0 80,80" />
                        </svg>
                        <div class="logo-text">
                            <span class="logo-title">Modsy</span>
                            <span class="logo-subtitle">FURNITURE</span>
                        </div>
                    </a>
                </div>
            </div>

            <nav class="main-nav">
                <ul class="main-nav__list">
                    <li><a href="index.html" class="main-nav__link">Home</a></li>
                    <li><a href="products.html" class="main-nav__link main-nav__link--active">Products</a></li>
                    <li><a href="contact.html" class="main-nav__link">Contact</a></li>
                </ul>
            </nav>

            <div class="header-right">
                <div class="header-actions">
                    <a href="search.html" class="header-action-link"><ion-icon name="search-outline"></ion-icon></a>
                    <a href="#" class="header-action-link"><ion-icon name="cart-outline"></ion-icon></a>
                    <a href="auth/login.html" class="header-action-link"><ion-icon name="person-outline"></ion-icon></a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container section-padding" style="margin-top: 90px;">
        <header class="categories__header">
            <h2 class="categories__title">Our Collection</h2>
            <div class="categories__nav">
                <span class="categories__view-all" id="results-count">12 Results</span>
            </div>
        </header>

        <!-- Filters -->
        <div class="filters-bar scrollbar-hide" id="categories-filter">
            <button class="filter-btn filter-btn--active" data-category="All">All Products</button>
            <button class="filter-btn" data-category="Garden">Garden</button>
            <button class="filter-btn" data-category="Kitchen">Kitchen</button>
            <button class="filter-btn" data-category="Dining">Dining</button>
            <button class="filter-btn" data-category="Living">Living</button>
            <button class="filter-btn" data-category="Bedroom">Bedroom</button>
            <button class="filter-btn" data-category="Kids Room">Kids Room</button>
            <button class="filter-btn" data-category="Bathroom">Bathroom</button>
            <button class="filter-btn" data-category="Office">Office</button>
            <button class="filter-btn" data-category="Storage">Storage</button>
        </div>

        <!-- Estructura de tarjetas de productos estilo galería moderna -->
        <section class="products-section">
            <div class="products-section__grid" id="products-grid">
                <!-- Dynamic cards loaded via JS -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer__grid">
                <div style="grid-column: span 5;">
                    <h2 class="hero__title" style="font-size: 2rem; color: var(--color-primary);">Join our community</h2>
                    <p class="hero__description" style="color: var(--color-secondary);">Stay updated with the latest furniture trends and exclusive offers.</p>
                    <form class="form-group" style="max-width: 300px;">
                        <input type="email" placeholder="Your email address">
                        <button type="submit" class="btn btn--primary" style="margin-top: 1rem; width: 100%;">Subscribe</button>
                    </form>
                </div>
            </div>
            <div class="footer__brand-text">Modsy.</div>
        </div>
    </footer>

    <script src="../assets/js/products-data.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="../assets/js/navbar-updater.js"></script>
    <script src="../assets/js/script.js"></script>

    <script type="module">
    import { productService } from '../assets/js/api-services.js';

    document.addEventListener('DOMContentLoaded', async () => {
        const grid = document.getElementById('products-grid');
        const filterContainer = document.getElementById('categories-filter');
        const countEl = document.getElementById('results-count');

        if (!grid) return;

        // Extract category parameter from URL
        const urlParams = new URLSearchParams(window.location.search);
        let selectedCategory = urlParams.get('category') || 'All';

        let allApiProducts = [];

        try {
            // Render beautiful skeleton cards while loading the database data
            let skeletonHtml = '';
            for(let i = 0; i < 8; i++) {
                skeletonHtml += `
                    <div class="product-card skeleton-card">
                        <div class="product-card__image skeleton" style="aspect-ratio: 1/1; width: 100%;"></div>
                        <div class="product-card__info" style="padding: 1rem 0; display:flex; flex-direction:column; gap:0.5rem;">
                            <div style="display:flex; justify-content:space-between; gap:1rem;">
                                <div class="skeleton" style="height: 1rem; width: 60%; border-radius:4px;"></div>
                                <div class="skeleton" style="height: 1rem; width: 20%; border-radius:4px;"></div>
                            </div>
                            <div class="skeleton" style="height: 0.75rem; width: 45%; border-radius:4px; margin-top:0.25rem;"></div>
                        </div>
                    </div>
                `;
            }
            grid.innerHTML = skeletonHtml;
            allApiProducts = await productService.getAll();
        } catch (err) {
            grid.innerHTML = `<p style="grid-column: 1/-1; color: red; text-align:center;">Error loading products from server.</p>`;
            console.error(err);
            return;
        }

        function renderProducts(category) {
            grid.innerHTML = '';
            
            const filtered = category === 'All' 
                ? allApiProducts 
                : allApiProducts.filter(p => p.category && p.category.toLowerCase() === category.toLowerCase());

            if (countEl) {
                countEl.textContent = `${filtered.length} Results`;
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--color-stone-400);">No products found.</p>';
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.setAttribute('data-id', p.id || p._id);
                
                // Support for uploaded images vs absolute urls
                const imgUrl = p.image && p.image.startsWith('/uploads') 
                    ? `http://${window.location.hostname}:5000${p.image}` 
                    : (p.image || 'https://via.placeholder.com/300x300?text=No+Image');

                // Fallback for colors not stored in backend
                let colorsHtml = '';
                if (p.colors && Array.isArray(p.colors)) {
                    p.colors.forEach((c, idx) => {
                        colorsHtml += `<span class="product-card__color-swatch" style="background:${c.code}; cursor:pointer;" data-img="${c.img}"></span>`;
                    });
                }

                card.innerHTML = `
                  <div class="product-card__image" style="cursor:pointer;">
                    <img src="${imgUrl}" alt="${p.name}" class="product-card__img">
                    <button class="product-card__favorite-btn" aria-label="Add to favorites"><ion-icon name="heart-outline"></ion-icon></button>
                  </div>
                  <div class="product-card__info">
                    <div class="product-card__header">
                      <div class="product-card__name" style="cursor:pointer;">${p.name}</div>
                      <div class="product-card__price">${String(p.price).includes('€') ? p.price : p.price + '€'}</div>
                    </div>
                    <div class="product-card__footer">
                      <div class="product-card__category">${(p.category || 'UNSORTED').toUpperCase()}</div>
                      <div class="product-card__colors">
                        ${colorsHtml}
                      </div>
                    </div>
                  </div>
                `;

                // Handle Swatches
                card.querySelectorAll('.product-card__color-swatch').forEach(swatch => {
                    swatch.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const newImg = swatch.getAttribute('data-img');
                        card.querySelector('.product-card__img').src = newImg;
                    });
                });

                // Detail routing
                const detailTrigger = card.querySelector('.product-card__image');
                const nameTrigger = card.querySelector('.product-card__name');
                const handleDetail = () => {
                    window.location.href = `product-detail.html?id=${p.id || p._id}`;
                };
                detailTrigger.addEventListener('click', handleDetail);
                nameTrigger.addEventListener('click', handleDetail);

                grid.appendChild(card);
            });

            // Update active state on buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.getAttribute('data-category').toLowerCase() === category.toLowerCase()) {
                    btn.classList.add('filter-btn--active');
                } else {
                    btn.classList.remove('filter-btn--active');
                }
            });
        }

        if (filterContainer) {
            filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-category');
                    const url = new URL(window.location);
                    url.searchParams.set('category', cat);
                    window.history.pushState({}, '', url);
                    renderProducts(cat);
                });
            });
        }

        renderProducts(selectedCategory);
    });
    </script>
</body>
</html>
