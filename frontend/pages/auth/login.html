<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Modsy</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    
    <style>
        /* Route-specific overrides */
        .auth-image-col {
            background: url('https://images.pexels.com/photos/1866141/pexels-photo-1866141.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- Centered Form Panel -->
        <div class="auth-content-col">
            <div class="auth-inner-form">
                <!-- Modsy Spiral Logo at top of form -->
                <a href="../index.html" class="logo-link" style="color:#002833 !important; text-decoration:none; display:flex; align-items:center; gap:10px; margin-bottom:2rem; justify-content:center;">
                    <svg class="logo-spiral" viewBox="0 0 100 100" width="32" height="32" fill="none" stroke="#002833" stroke-width="4.5" stroke-linecap="round">
                        <path d="M 50,50 A 6,6 0 1,0 56,56 A 12,12 0 1,1 44,44 A 18,18 0 1,0 68,68 A 24,24 0 1,1 32,32 A 30,30 0 1,0 80,80" />
                    </svg>
                    <div class="logo-text" style="display:flex; flex-direction:column; line-height:1; text-align:left;">
                        <span class="logo-title" style="font-size:1.25rem !important; color:#002833 !important; font-weight:700;">Modsy</span>
                        <span class="logo-subtitle" style="font-size:0.5rem !important; color:#64748b !important; letter-spacing:0.2em;">FURNITURE</span>
                    </div>
                </a>

                <h1 class="auth-title">Sign in</h1>

                <form id="login-form">
                    <div class="form-group" style="margin-bottom:1.5rem;">
                        <label>Email</label>
                        <input type="email" id="email" class="input-modsy" placeholder="e.g. alex@example.com" required>
                    </div>
                    <div class="form-group" style="margin-bottom:2rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label style="margin:0;">Password</label>
                            <a href="#" id="forgot-password-trigger" style="font-size: 0.8rem; color: #64748b; text-decoration: none; font-weight:600;">Forgot?</a>
                        </div>
                        <input type="password" id="password" class="input-modsy" style="margin-top:0.5rem;" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-modsy-primary">Continue</button>
                </form>

                <div class="auth-footer">
                    New to Modsy? <a href="register.html">Create account</a>
                </div>
            </div>
        </div>
    </div>

    <!-- External Framework Loader -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initLoginView } from '../../assets/js/auth-ui.js';
        initLoginView();
    </script>
    
    <!-- Graphic Modules -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
