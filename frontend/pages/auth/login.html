<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Modsy.</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    
    <style>
        /* Route-specific overrides */
        .auth-image-col {
            background: url('https://images.pexels.com/photos/1350789/pexels-photo-1350789.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- Image Cover Panel -->
        <div class="auth-image-col">
            <div class="auth-image-overlay">
                <a href="../index.html" style="color:white; display:flex; align-items:center; gap:0.5rem; text-decoration:none; font-weight:800; font-size:1.2rem;">
                    <ion-icon name="crop-outline" style="font-size:1.5rem;"></ion-icon> Modsy.
                </a>
                <div>
                    <h3 style="font-size: 2.5rem; font-weight: 800; margin-bottom:1rem; line-height:1;">Define your<br>own space.</h3>
                    <p style="opacity:0.8; max-width: 300px;">Access your account to design, shop, and manage your premium furniture collection.</p>
                </div>
            </div>
        </div>

        <!-- Form Panel -->
        <div class="auth-content-col">
            <div class="auth-inner-form">
                <h1 class="auth-title">Sign in</h1>

                <form id="login-form">
                    <div class="form-group" style="margin-bottom:1.5rem;">
                        <label>Email</label>
                        <input type="email" id="email" class="input-modsy" placeholder="e.g. alex@example.com" required>
                    </div>
                    <div class="form-group" style="margin-bottom:2rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label style="margin:0;">Password</label>
                            <a href="#" id="forgot-password-trigger" style="font-size: 0.8rem; color: #78716c; text-decoration: none; font-weight:600;">Forgot?</a>
                        </div>
                        <input type="password" id="password" class="input-modsy" style="margin-top:0.5rem;" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-modsy-primary">Continue</button>
                </form>

                <div class="auth-footer">
                    New to Modsy? <a href="register.html">Create account</a>
                </div>
            </div>
        </div>
    </div>

    <!-- External Framework Loader -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initLoginView } from '../../assets/js/auth-ui.js';
        initLoginView();
    </script>
    
    <!-- Graphic Modules -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
