<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Modsy. | Sign Up</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    
    <style>
        .auth-image-col {
            background: url('https://images.pexels.com/photos/1571460/pexels-photo-1571460.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- Image Cover Panel -->
        <div class="auth-image-col">
            <div class="auth-image-overlay">
                <a href="../index.html" style="color:white; display:flex; align-items:center; gap:0.5rem; text-decoration:none; font-weight:800; font-size:1.2rem;">
                    <ion-icon name="crop-outline" style="font-size:1.5rem;"></ion-icon> Modsy.
                </a>
                <div>
                    <h3 style="font-size: 2.5rem; font-weight: 800; margin-bottom:1rem; line-height:1;">Your journey<br>starts here.</h3>
                    <p style="opacity:0.8; max-width: 300px;">Create a profile to start saving items, track orders, and unlock exclusive offers.</p>
                </div>
            </div>
        </div>

        <!-- Form Panel -->
        <div class="auth-content-col">
            <div class="auth-inner-form">
                <h1 class="auth-title">Get started</h1>

                <form id="register-form">
                    <div class="form-group" style="margin-bottom:1.25rem;">
                        <label>Full Name</label>
                        <input type="text" id="name" class="input-modsy" placeholder="e.g. Alex Morgan" required>
                    </div>
                    <div class="form-group" style="margin-bottom:1.25rem;">
                        <label>Email Address</label>
                        <input type="email" id="email" class="input-modsy" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group" style="margin-bottom:1.5rem;">
                        <label>Password</label>
                        <input type="password" id="password" class="input-modsy" placeholder="At least 6 chars" required>
                    </div>
                    <button type="submit" class="btn-modsy-primary">Create account</button>
                </form>

                <div class="auth-footer">
                    Already a member? <a href="login.html">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initRegisterView } from '../../assets/js/auth-ui.js';
        initRegisterView();
    </script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
