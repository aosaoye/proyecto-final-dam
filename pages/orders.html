<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Modsy.</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- Font styling for consistency -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #fafaf9; /* soft stone bg */
        }
        /* Make header solid so it overrides transparent hero style defaults */
        .site-header {
            background: white !important;
            border-bottom: 1px solid #e7e5e4;
            position: sticky !important;
            top: 0;
            z-index: 100;
        }
        
        .orders-container {
            max-width: 900px;
            margin: 4rem auto;
            padding: 0 1.5rem;
            min-height: 60vh;
        }
        
        .orders-header {
            margin-bottom: 3rem;
            text-align: center;
        }
        
        .orders-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #1c1917;
            margin-bottom: 0.5rem;
        }
        .orders-subtitle {
            color: #78716c;
            font-size: 1rem;
        }

        /* Order Card Styling */
        .order-card {
            background: white;
            border: 1px solid #e7e5e4;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.04);
        }
        
        .order-card-header {
            padding: 1.5rem;
            background: #fcfbfb;
            border-bottom: 1px solid #f5f5f4;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 1rem;
            align-items: center;
        }
        
        .header-stat-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #a8a29e;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }
        .header-stat-val {
            font-weight: 600;
            color: #1c1917;
            font-size: 0.9rem;
        }
        .order-id-font {
            font-family: monospace;
            font-weight: bold;
            background: #f5f5f4;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        
        .order-status-badge {
            background: #dcfce7;
            color: #166534;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
        }

        /* Order Items List */
        .order-items-list {
            padding: 1.5rem;
        }
        .order-item-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #f5f5f4;
        }
        .order-item-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .order-item-row:first-child {
            padding-top: 0;
        }
        
        .order-item-dot {
            width: 10px;
            height: 10px;
            background: #d6d3d1;
            border-radius: 50%;
        }
        
        .order-item-info {
            flex-grow: 1;
        }
        .order-item-name {
            font-weight: 600;
            color: #1c1917;
            font-size: 1rem;
        }
        .order-item-qty {
            font-size: 0.85rem;
            color: #78716c;
            margin-top: 0.1rem;
        }
        .order-item-price {
            font-weight: 700;
            color: #1c1917;
        }

        /* Empty state */
        .empty-orders {
            text-align: center;
            padding: 4rem 2rem;
        }
        .empty-icon {
            font-size: 4rem;
            color: #e7e5e4;
            margin-bottom: 1.5rem;
        }
        
        .btn-shop-now {
            display: inline-block;
            background: #1c1917;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            transition: background 0.2s;
        }
        .btn-shop-now:hover {
            background: #44403c;
        }
        
        .loading-spinner {
            display: block;
            width: 40px;
            height: 40px;
            margin: 5rem auto;
            border: 4px solid #f5f5f4;
            border-top: 4px solid #1c1917;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .order-card-header {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
    <!-- Auth Guard for safety before loading entire script -->
    <script type="module">
        import { authService } from '../assets/js/api-services.js';
        if (!authService.isAuthenticated()) {
            window.location.href = 'auth/login.html';
        }
    </script>
</head>
<body>

    <!-- SITE HEADER (Will be augmented automatically by navbar-updater.js) -->
    <header class="site-header site-header--solid">
        <div class="site-header__container container">
            <div class="header-left">
                <div class="logo">
                    <a href="index.html"><ion-icon name="crop-outline"></ion-icon></a>
                    <a href="index.html">Modsy.</a>
                </div>
            </div>
            <nav class="main-nav">
                <ul class="main-nav__list">
                    <li><a href="index.html" class="main-nav__link">Home</a></li>
                    <li><a href="products.html" class="main-nav__link">Products</a></li>
                    <li><a href="contact.html" class="main-nav__link">Contact</a></li>
                </ul>
            </nav>
            <div class="header-right">
                <div class="header-actions">
                    <!-- Placeholder for JS injection -->
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="orders-container">
            <div class="orders-header">
                <h1 class="orders-title">Order History</h1>
                <p class="orders-subtitle">View standard details and statuses of your past store purchases.</p>
            </div>

            <div id="orders-feed">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer__grid">
                <div style="grid-column: span 5;">
                    <h2 class="hero__title" style="font-size: 2rem; color: var(--color-primary);">Furniture that fits you.</h2>
                    <p class="hero__description" style="color: var(--color-secondary);">Design custom furniture that fits your room down to the last millimeter.</p>
                </div>
            </div>
            <div class="footer__brand-text">Modsy.</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="../assets/js/navbar-updater.js"></script>

    <script type="module">
        import { orderService } from '../assets/js/api-services.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const feed = document.getElementById('orders-feed');

            try {
                const orders = await orderService.getMyOrders();

                if (!orders || orders.length === 0) {
                    feed.innerHTML = `
                        <div class="empty-orders">
                            <ion-icon name="bag-outline" class="empty-icon"></ion-icon>
                            <h2>You haven't placed any orders yet</h2>
                            <p style="color: #78716c; margin-top: 0.5rem;">Explore our catalog and find something you love!</p>
                            <a href="products.html" class="btn-shop" style="margin-top: 1.5rem;">Browse Store</a>
                        </div>
                    `;
                    return;
                }

                // Render the elegant list
                feed.innerHTML = orders.map(order => {
                    const date = new Date(order.createdAt).toLocaleDateString('en-US', { 
                        day: 'numeric', 
                        month: 'long', 
                        year: 'numeric' 
                    });

                    return `
                        <article class="order-card">
                            <div class="order-card-header">
                                <div>
                                    <div class="header-stat-label">Date</div>
                                    <div class="header-stat-val">${date}</div>
                                </div>
                                <div>
                                    <div class="header-stat-label">Total</div>
                                    <div class="header-stat-val" style="color: #0c0a09; font-weight:800; font-size:1rem;">${order.totalAmount.toFixed(2)} €</div>
                                </div>
                                <div>
                                    <div class="header-stat-label">Order ID</div>
                                    <div class="header-stat-val"><span class="order-id-font">#${order.id.slice(-8).toUpperCase()}</span></div>
                                </div>
                                <div style="text-align: right;">
                                    <span class="order-status-badge">${order.status === 'pending' ? 'Processing' : 'Completed'}</span>
                                </div>
                            </div>
                            
                            <div class="order-items-list">
                                ${order.items.map(item => `
                                    <div class="order-item-row">
                                        <div class="order-item-dot"></div>
                                        <div class="order-item-info">
                                            <div class="order-item-name">${item.productName || 'Product'}</div>
                                            <div class="order-item-qty">Qty: ${item.quantity} x ${item.price.toFixed(2)}€</div>
                                        </div>
                                        <div class="order-item-price">${(item.quantity * item.price).toFixed(2)}€</div>
                                    </div>
                                `).join('')}
                            </div>
                        </article>
                    `;
                }).join('');

            } catch (err) {
                feed.innerHTML = `
                    <div style="text-align:center; color:#ef4444; padding: 3rem;">
                        <ion-icon name="warning-outline" style="font-size: 3rem; margin-bottom:1rem;"></ion-icon>
                        <h3>Error loading your orders</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
