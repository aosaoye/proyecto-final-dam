<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Modsy | Sign Up</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    
    <style>
        .auth-image-col {
            background: url('https://images.pexels.com/photos/6044733/pexels-photo-6044733.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- Image Cover Panel -->
        <div class="auth-image-col">
            <div class="auth-image-overlay">
                <a href="../index.html" class="logo-link" style="color:white !important; text-decoration:none;">
                    <svg class="logo-spiral" viewBox="0 0 100 100" width="32" height="32" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
                        <path d="M 50,50 A 6,6 0 1,0 56,56 A 12,12 0 1,1 44,44 A 18,18 0 1,0 68,68 A 24,24 0 1,1 32,32 A 30,30 0 1,0 80,80" />
                    </svg>
                    <div class="logo-text" style="display:flex; flex-direction:column; line-height:1;">
                        <span class="logo-title" style="font-size:1.25rem !important; color:#FFFFFF !important; font-weight:700;">Modsy</span>
                        <span class="logo-subtitle" style="font-size:0.5rem !important; color:rgba(255,255,255,0.7) !important; letter-spacing:0.2em;">FURNITURE</span>
                    </div>
                </a>
                <div>
                    <h3 style="font-size: 2.5rem; font-weight: 800; margin-bottom:1rem; line-height:1;">Your journey<br>starts here.</h3>
                    <p style="opacity:0.8; max-width: 300px;">Create a profile to start saving items, track orders, and unlock exclusive offers.</p>
                </div>
            </div>
        </div>

        <!-- Form Panel -->
        <div class="auth-content-col">
            <div class="auth-inner-form">
                <h1 class="auth-title">Get started</h1>

                <form id="register-form">
                    <div class="form-group" style="margin-bottom:1.25rem;">
                        <label>Full Name</label>
                        <input type="text" id="name" class="input-modsy" placeholder="e.g. Alex Morgan" required>
                    </div>
                    <div class="form-group" style="margin-bottom:1.25rem;">
                        <label>Email Address</label>
                        <input type="email" id="email" class="input-modsy" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group" style="margin-bottom:1.5rem;">
                        <label>Password</label>
                        <input type="password" id="password" class="input-modsy" placeholder="At least 6 chars" required>
                    </div>
                    <button type="submit" class="btn-modsy-primary">Create account</button>
                </form>

                <div class="auth-footer">
                    Already a member? <a href="login.html">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initRegisterView } from '../../assets/js/auth-ui.js';
        initRegisterView();
    </script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
