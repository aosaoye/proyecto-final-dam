<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Modsy. | Sign Up</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8faff 0%, #ffffff 100%);
            padding: 2rem;
        }
        .auth-card {
            background: var(--color-white);
            padding: 3rem;
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .auth-header .logo {
            color: var(--color-primary);
            margin-bottom: 1.5rem;
            justify-content: center;
        }
        .auth-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }
        .auth-subtitle {
            color: var(--color-secondary);
            font-size: 0.9rem;
        }
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--color-secondary);
        }
        .auth-footer a {
            color: var(--color-primary);
            font-weight: 700;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <header class="auth-header">
                <div class="logo">
                    <a href="../index.html" style="display:flex; align-items:center; gap:0.5rem;">
                        <ion-icon name="crop-outline"></ion-icon>
                        <span>Modsy.</span>
                    </a>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join our community of design lovers</p>
            </header>

            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group" style="margin-top: 1.25rem;">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group" style="margin-top: 1.25rem;">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <p style="font-size: 0.75rem; color: var(--color-stone-400); margin-top: 1rem;">
                    By signing up, you agree to our <a href="#" style="color: var(--color-stone-500); text-decoration: underline;">Terms</a> and <a href="#" style="color: var(--color-stone-500); text-decoration: underline;">Privacy Policy</a>.
                </p>
                <button type="submit" class="btn btn--primary" style="width: 100%; margin-top: 2rem; padding: 1.2rem;">Get Started</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
