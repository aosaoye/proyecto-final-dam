<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Modsy.</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .search-hero {
            padding: 120px 0 60px;
            background: linear-gradient(to bottom, #fafaf9, #ffffff);
            text-align: center;
        }
        .search-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .search-input-wrapper {
            position: relative;
            margin-top: 30px;
        }
        .search-input {
            width: 100%;
            padding: 20px 30px 20px 60px;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            font-size: 1.1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            font-family: var(--font-plus-jakarta);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .search-icon {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--color-secondary);
        }
        .search-results-info {
            margin-top: 40px;
            font-size: 0.9rem;
            color: var(--color-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        /* Mobile specific adjustments for search */
        @media (max-width: 640px) {
            .search-hero {
                padding: 100px 0 40px;
            }
            .search-input {
                padding: 15px 25px 15px 50px;
                font-size: 1rem;
            }
            .search-icon {
                left: 20px;
                font-size: 1.2rem;
            }
        }
    </style>
    <style>
        /* Refined search layout following global aesthetics */
        .search-page-header {
            padding: 6rem 0 2rem;
            text-align: center;
            background: #fafaf9;
            border-bottom: 1px solid #e7e5e4;
        }
        .search-input-container {
            max-width: 600px;
            margin: 2rem auto;
            position: relative;
        }
        .search-input-hero {
            width: 100%;
            padding: 1.25rem 1.5rem 1.25rem 3.5rem;
            border-radius: 50px;
            border: 1px solid #e7e5e4;
            font-size: 1.1rem;
            font-family: var(--font-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .search-input-hero:focus {
            outline: none;
            border-color: #1c1917;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        .search-input-hero-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: #a8a29e;
            pointer-events: none;
        }
        
        .search-indicator {
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #78716c;
            margin-top: 2rem;
            display: inline-block;
            border-bottom: 2px solid #e7e5e4;
            padding-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <header class="site-header site-header--solid">
        <div class="site-header__container container">
            <div class="header-left">
                <div class="logo">
                    <button class="mobile-menu-toggle" aria-label="Open Menu">
                        <ion-icon name="menu-outline"></ion-icon>
                    </button>
                    <a href="index.html"><ion-icon name="crop-outline"></ion-icon></a>
                    <a href="index.html">Modsy.</a>
                </div>
            </div>
            <nav class="main-nav">
                <ul class="main-nav__list">
                    <li><a href="index.html" class="main-nav__link">Home</a></li>
                    <li><a href="products.html" class="main-nav__link">Products</a></li>
                    <li><a href="contact.html" class="main-nav__link">Contact</a></li>
                </ul>
            </nav>
            <div class="header-right">
                <div class="header-actions">
                    <!-- Auto injected search/cart via navbar-updater.js -->
                </div>
            </div>
        </div>
    </header>

    <main class="main-container" style="margin-top: 70px;">
        <section class="search-page-header">
            <div class="container">
                <h1 style="font-size: 2.5rem; font-weight: 900; letter-spacing:-0.03em;">Catalog Search</h1>
                <p style="color: #78716c; margin-top: 0.5rem;">Find your next piece of premium furniture</p>
                
                <div class="search-input-container">
                    <input type="text" id="search-box" class="search-input-hero" placeholder="Type furniture name, category, or keywords..." autofocus>
                    <ion-icon name="search-outline" class="search-input-hero-icon"></ion-icon>
                </div>

                <span id="results-count" class="search-indicator">Awaiting input</span>
            </div>
        </section>
        
        <div class="container" style="padding-top: 4rem; padding-bottom: 5rem;">
            <section class="products-section">
            <div class="products-section__grid" id="products-grid">
                <div style="grid-column:1/-1; text-align:center; padding: 4rem 0; color:#94a3b8; font-style:italic;">
                    Type in the search bar above to start exploring the catalog.
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer__grid">
                <div style="grid-column: span 5;">
                    <h2 class="hero__title" style="font-size: 2rem; color: var(--color-primary);">Furniture that fits you.</h2>
                    <p class="hero__description" style="color: var(--color-secondary);">Design custom furniture that fits your room down to the last millimeter.</p>
                </div>
            </div>
            <div class="footer__brand-text">Modsy.</div>
        </div>
    </footer>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="../assets/js/navbar-updater.js"></script>
    
    <script type="module">
        import { productService } from '../assets/js/api-services.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const searchBox = document.getElementById('search-box');
            const grid = document.getElementById('products-grid');
            const countEl = document.getElementById('results-count');

            let catalog = [];
            
            try {
                catalog = await productService.getAll();
            } catch(err) {
                console.error("Store error", err);
            }

            function render(list) {
                grid.innerHTML = '';
                
                if (list.length === 0) {
                    countEl.textContent = 'Zero results found';
                    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding: 4rem 0; color:#94a3b8;">No products matched your keywords.</div>';
                    return;
                }

                countEl.textContent = `${list.length} Results match your keyword`;

                list.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.style.cursor = 'pointer';

                    const img = p.image && p.image.startsWith('/uploads') 
                        ? `http://${window.location.hostname}:5000${p.image}` 
                        : (p.image || 'https://via.placeholder.com/300');
                    
                    card.innerHTML = `
                      <div class="product-card__image">
                        <img src="${img}" alt="${p.name}" class="product-card__img">
                      </div>
                      <div class="product-card__info">
                        <div class="product-card__header">
                          <div class="product-card__name">${p.name}</div>
                          <div class="product-card__price">${p.price}€</div>
                        </div>
                        <div class="product-card__footer">
                          <div class="product-card__category">${(p.category||'').toUpperCase()}</div>
                        </div>
                      </div>
                    `;

                    card.addEventListener('click', () => {
                        window.location.href = `product-detail.html?id=${p.id || p._id}`;
                    });

                    grid.appendChild(card);
                });
            }

            searchBox.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                
                if (term.length < 1) {
                    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:4rem 0; color:#94a3b8; font-style:italic;">Type in the search bar above to start exploring the catalog.</div>';
                    countEl.textContent = 'Awaiting input';
                    return;
                }

                const hits = catalog.filter(p => {
                    return (p.name && p.name.toLowerCase().includes(term)) || 
                           (p.category && p.category.toLowerCase().includes(term)) || 
                           (p.description && p.description.toLowerCase().includes(term));
                });

                render(hits);
            });
            
            const qs = new URLSearchParams(window.location.search).get('q');
            if (qs) {
                searchBox.value = qs;
                setTimeout(() => searchBox.dispatchEvent(new Event('input')), 400);
            }
        });
    </script>
</body>
</html>
