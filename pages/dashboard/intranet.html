<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | Modsy.</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <header class="site-header site-header--scrolled">
        <div class="site-header__container container">
            <div class="header-left">
                <div class="logo">
                    <a href="../index.html"><ion-icon name="crop-outline"></ion-icon></a>
                    <a href="../index.html">Modsy.</a>
                </div>
            </div>

            <nav class="main-nav">
                <ul class="main-nav__list">
                    <li><a href="../index.html" class="main-nav__link">Home</a></li>
                    <li><a href="../products.html" class="main-nav__link">Products</a></li>
                    <li><a href="../contact.html" class="main-nav__link">Contact</a></li>
                </ul>
            </nav>

            <div class="header-right">
                <div class="header-actions">
                    <a href="../index.html" class="header-action-link"><ion-icon name="log-out-outline"></ion-icon></a>
                </div>
            </div>
        </div>
    </header>

    <main class="container section-padding" style="margin-top: 100px;">
        <h2 class="hero__title" style="font-size: 2.5rem; color: var(--color-primary);">Welcome back, John</h2>
        <p class="hero__description" style="color: var(--color-secondary);">Manage your orders and account settings.</p>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-lg); margin-top: var(--spacing-xl);">
            <div style="background: var(--color-stone-50); padding: var(--spacing-lg); border-radius: var(--radius-md);">
                <h3 style="font-size: var(--font-size-base); margin-bottom: var(--spacing-sm);">Recent Orders</h3>
                <p style="font-size: var(--font-size-xs); color: var(--color-stone-500);">You have no recent orders.</p>
            </div>
            <div style="background: var(--color-stone-50); padding: var(--spacing-lg); border-radius: var(--radius-md);">
                <h3 style="font-size: var(--font-size-base); margin-bottom: var(--spacing-sm);">Shipping Address</h3>
                <p style="font-size: var(--font-size-xs); color: var(--color-stone-500);">123 Design Street, Madrid.</p>
            </div>
            <div style="background: var(--color-stone-50); padding: var(--spacing-lg); border-radius: var(--radius-md);">
                <h3 style="font-size: var(--font-size-base); margin-bottom: var(--spacing-sm);">Account Credits</h3>
                <p style="font-size: var(--font-size-xl); font-weight: 700;">0.00€</p>
            </div>
        </div>
    </main>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
